name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pages must be enabled once: repo Settings → Pages → Source:
      # "GitHub Actions". This is a per-repo PROJECT page —
      # https://<user>.github.io/<repo>/ — independent of any user page.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          DEPLOY_TARGET: gh-pages
          # Optional, privacy-friendly analytics. Set the GOATCOUNTER repo
          # variable (Settings → Secrets and variables → Actions → Variables)
          # to your GoatCounter count endpoint; unset = no analytics shipped.
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
